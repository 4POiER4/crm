services:
  crm:
    build:
      context: .
    container_name: vip-tours-crm
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - vip-tours-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/crm').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  vip-tours-data:
    name: vip-tours-crm-data
